[project]
name = "intentguard"
version = "0.1.0"
description = "Know-Your-Agent guardrails for AI agents that operate a PayPal merchant account"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "starlette>=1.0",
    "uvicorn>=0.30",
    "anyio>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["intentguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
